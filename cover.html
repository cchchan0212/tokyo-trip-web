<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 秋楓與東京的約定 — 手繪行程地圖</title>

  <!-- 可愛圓角字體（離線時自動退回系統字型） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #fffaf2;
      --brown: #7a4520;
      --brown-soft: #9a6a3c;
      --amber: #e07b1f;
      --amber-soft: #f4a64a;
      --line: rgba(224, 123, 31, 0.45);
    }

    /* ===== A4 列印設定：兩張圖各自獨立成一頁 ===== */
    @page {
      size: A4;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      /* 確保列印 / 匯出 PDF 時背景與圖片色彩完整保留 */
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "M PLUS Rounded 1c", "Yu Gothic", "Hiragino Maru Gothic ProN",
        "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: #e8dcc9;
      padding: 0 14px 32px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ===== 頂部工具列（列印時自動隱藏） ===== */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 -14px 20px;
      padding: 12px 14px;
      background: rgba(255, 250, 242, 0.94);
      border-bottom: 1.5px solid var(--line);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .toolbar-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--brown);
      letter-spacing: 0.04em;
    }
    .print-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      background: var(--amber);
      border: none;
      border-radius: 999px;
      padding: 10px 20px;
      cursor: pointer;
      box-shadow: 0 8px 18px -8px rgba(224, 123, 31, 0.75);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .print-btn:hover {
      background: #c96a12;
      transform: translateY(-1px);
    }
    .print-btn:active {
      transform: translateY(0);
    }

    /* ===== 每張手繪行程地圖一頁 ===== */
    .page {
      max-width: 1000px;    /* 圖片最大寬度上限 */
      margin: 0 auto 26px;  /* 水平置中顯示 */
    }

    .page img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 22px 48px -22px rgba(90, 55, 20, 0.55),
                  0 8px 20px -12px rgba(90, 55, 20, 0.35);
      background: var(--cream);
    }

    /* ===== 列印 / 匯出 PDF：隱藏標頭與按鈕、兩頁各自獨立 ===== */
    @media print {
      html, body {
        background: none;
        margin: 0;
        padding: 0;
      }

      /* 列印時自動隱藏標頭與按鈕 */
      .toolbar,
      .print-btn {
        display: none !important;
      }

      .page {
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: none;
        min-height: 285mm;  /* 略小於 A4 高度，避免滿版造成多餘空白頁 */
        margin: 0;
        page-break-after: always;  /* Part 1 / Part 2 各自獨立佔用一張 A4 */
        break-after: page;
        page-break-inside: avoid;
        break-inside: avoid;
      }

      /* 最後一頁不再強制分頁，避免尾端多出空白頁 */
      .page:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      .page img {
        width: 100%;
        max-width: 100%;
        max-height: 280mm;
        height: auto;
        object-fit: contain;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <!-- 頂部「列印 / 匯出 PDF」按鈕（列印時自動隱藏） -->
  <header class="toolbar">
    <div class="toolbar-inner">
      <span class="toolbar-title">🍁 2026 秋楓與東京的約定 · 手繪行程地圖</span>
      <button type="button" class="print-btn" onclick="window.print()">🖨️ 列印 / 匯出 PDF</button>
    </div>
  </header>

  <!-- 第一頁：郊外自駕篇 -->
  <section class="page">
    <img src="Part1.jpeg" alt="2026 秋楓與東京的約定 Part 1" style="width:100%; max-width:1000px; display:block; margin:0 auto 20px auto; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,0.12);">
  </section>

  <!-- 第二頁：東京市區篇 -->
  <section class="page">
    <img src="Part2.jpeg" alt="2026 秋楓與東京的約定 Part 2" style="width:100%; max-width:1000px; display:block; margin:0 auto; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,0.12);">
  </section>

</body>
</html>
