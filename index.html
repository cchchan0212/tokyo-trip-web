<!DOCTYPE html>

  <!-- 自訂動畫樣式（秋日自駕主題） -->
  <style>
    /* 頁面背景設定：確保 cover / center / no-repeat / fixed 皆生效 */
    body {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* 可愛小汽車行駛/搖晃動畫 */
    @keyframes car-drive {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(3px) rotate(-4deg); }
      75% { transform: translateX(-3px) rotate(4deg); }
    }
    .car-drive {
      display: inline-block;
      animation: car-drive 1.6s ease-in-out infinite;
    }

    /* 重新整理按鈕 hover 旋轉 */
    .refresh-btn i {
      display: inline-block;
      transition: transform 0.5s ease;
    }
    .refresh-btn:hover i {
      transform: rotate(180deg);
    }

    /* 行程封面按鈕：暖秋橘膠囊造型 */
    .cover-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      color: #7c3f00;
      background: #fffaf2;
      border: 2px solid #e67e22;
      border-radius: 20px;
      padding: 8px 16px;
      text-decoration: none;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }
    .cover-btn:hover {
      transform: translateY(-2px);
      background: #fff3e0;
      box-shadow: 0 6px 16px -4px rgba(230, 126, 34, 0.65);
    }
    .cover-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    }

    /* 楓葉飄落動畫 */
    @keyframes leaf-fall {
      0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.75; }
      100% { transform: translateY(110vh) translateX(70px) rotate(360deg); opacity: 0; }
    }
    .falling-leaf {
      position: absolute;
      top: 0;
      pointer-events: none;
      animation: leaf-fall linear infinite;
    }

    /* 地圖導航按鈕脈衝動畫 */
    @keyframes gentle-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .map-btn {
      animation: gentle-pulse 2s ease-in-out infinite;
    }
    .map-btn:hover {
      animation-play-state: paused;
    }

    /* 載入吉祥物彈跳動畫 */
    @keyframes float-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .loading-mascot {
      display: inline-block;
      animation: float-bounce 1.4s ease-in-out infinite;
    }

    /* 景點與交通速查按鈕：hover 微放大 + 柔和琥珀色光暈 */
    .quick-link-btn {
      transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    }
    .quick-link-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 24px -8px rgba(217, 119, 6, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
    }
    .quick-link-btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* 美食簡介彈窗：淡入 + 微微上浮 */
    @keyframes modal-pop {
      0% { opacity: 0; transform: translateY(8px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-panel {
      animation: modal-pop 0.22s ease-out;
    }

  </style>

  <script>
    // ⚠️ 稍後建立 Apps Script 後，將取得的 Web App URL 貼在此處
    const API_URL = "https://script.google.com/macros/s/AKfycbzqGdc4Ht_cyHIGso6pG6hhtsiw0Lv_iRUgJFlHwEBU3qWsiEEehqoAYW7tojCmxaM/exec";

    let allData = [];
    let currentDate = "";

    // 每日背景圖片對應表（依日期切換景點風景照，對應 images 資料夾內照片）
    const bgImages = {
      '10/3': 'images/10-3.jpg', // 箱根蘆之湖與鳥居
      '10/4': 'images/10-4.jpg', // 御殿場 / 富士山
      '10/5': 'images/10-5.jpg', // 長野 諏訪湖
      '10/6': 'images/10-6.jpg', // 長野 上高地 梓川
      '10/7': 'images/10-7.jpg', // 10/7 行程照片
      '10/8': 'images/10-8.jpg', // 10/8 行程照片
      '10/9': 'images/10-8.jpg', // 10/9 沿用 10/8 照片
      '10/10': 'images/10-7.jpg', // 10/10 沿用 10/7 照片
    };
    const DEFAULT_BACKGROUND = 'images/10-3.jpg'; // 預設 / 其他日期一律使用 10/3 照片

    // 取得某日期對應的背景圖片（無對應時回傳預設 10/3 圖）
    function getBackgroundForDate(dateStr) {
      const d = new Date(dateStr);
      const key = `${d.getMonth() + 1}/${d.getDate()}`;
      return bgImages[key] || DEFAULT_BACKGROUND;
    }

    // 設定頁面背景：直接寫入 body 的 inline style（使用 url('...') 格式）
    function setBackground(imageUrl) {
      document.body.style.backgroundImage = `url('${imageUrl || DEFAULT_BACKGROUND}')`;
    }

    // 頁面初始化時，預設載入 images/10-3.jpg
    document.addEventListener('DOMContentLoaded', function () {
      document.body.style.backgroundImage = `url('${bgImages['10/3'] || DEFAULT_BACKGROUND}')`;
    });

    // 產生地圖導航連結：
    // 若 map_url 已是完整網址（以 http/https 開頭）則直接使用；
    // 否則轉為 Google 地圖搜尋連結，查詢字串優先使用 map_url，若無則使用 location。
    function getMapUrl(item) {
      const raw = item.map_url || '';
      if (/^https?:\/\//i.test(raw)) return raw;
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.map_url || item.location)}`;
    }

    // 將時間格式化為乾淨的 HH:mm 24 小時制文字（如 10:00）
    // 若已是 HH:mm 格式則保持原樣；若為 ISO 日期字串（如 1899-12-30T02:23:18.000Z）則取出時間部分
    function formatTime(time) {
      if (!time) return time;
      // 已符合 HH:mm（例如 10:00 / 02:00），直接回傳
      if (/^\d{1,2}:\d{2}$/.test(time)) return time;
      // 透過 Date 解析，取出的 HH:mm 為 24 小時制、補零至兩位數
      const date = new Date(time);
      if (isNaN(date.getTime())) return time;
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    // ===== 每日「景點與交通速查」快捷按鈕資料 =====
    // 每個按鈕包含：icon 圖示 / title 標題 / subtitle 小註解 / url 連結（官方網站或 Google 地圖搜尋）
    const TOKYO_QUICK_LINKS = [
      { icon: '🗼', title: '東京 / 銀座 購物與美食導覽', subtitle: '銀座商店街、美食與逛街重點', url: 'https://www.google.com/maps/search/?api=1&query=銀座 東京' },
      { icon: '🪴', title: 'garage SHIBUYA - Living with plants', subtitle: '澀谷 Scramble Square 9F · 綠植與質感花器選品店', action: 'spot', spot: 'garage_shibuya' },
    ];

    // ===== 去程 / 回程航班資訊（國泰航空 Cathay Pacific，PNR: D6VGKN）=====
    // 供右側速查的航班按鈕彈出詳細卡片使用（rows 依序顯示於彈窗）
    // key: outbound = 10/3（第一天）去程；return = 10/10（最後一天）回程
    const CATHAY_FLIGHTS = {
      // 10/3（第一天）去程：香港 HKG → 東京成田 NRT
      outbound: {
        icon: '✈️',
        title: '去程航班資訊 (CX524 - PNR: D6VGKN)',
        subtitle: '國泰航空 Cathay Pacific · 香港 HKG → 東京成田 NRT 第 2 航廈',
        note: '凌晨 01:20 起飛，建議 10/2 晚上約 22:20 前抵達香港國際機場辦理登機與安檢；抵達成田為 10/3 06:50。',
        rows: [
          { label: '航空公司 / 航班', value: '國泰航空 Cathay Pacific · CX524' },
          { label: '預訂參考編號 (PNR)', value: 'D6VGKN' },
          { label: '起飛時間', value: '2026-10-03 (六) 01:20' },
          { label: '出發地點', value: '香港國際機場 (HKG)' },
          { label: '抵達時間', value: '2026-10-03 (六) 06:50' },
          { label: '目的地', value: '東京成田國際機場 (NRT) 第 2 航廈 (Terminal 2)' },
        ],
        mapQuery: '香港國際機場',
        mapLabel: '導航到香港國際機場 (HKG)',
        siteLabel: '香港機場官網',

    // 取得所有不重複日期（合併 API 資料與本地行程資料）
    function getAllDates() {
      const dates = [...new Set(allData.map(item => item.date))];
      Object.keys(LOCAL_ITINERARY).forEach(key => {
        if (!dates.some(d => {
          const dd = new Date(d);
          return `${dd.getMonth() + 1}/${dd.getDate()}` === key;
        })) {
          dates.push(`2026-${key.replace('/', '-')}`);
        }
      });
      return dates.sort();
    }

    // 取得某日期的本地行程資料（該日無覆寫資料時回傳 null）
    function getLocalItemsForDate(dateStr) {
      const d = new Date(dateStr);
      const key = `${d.getMonth() + 1}/${d.getDate()}`;
      const items = LOCAL_ITINERARY[key];
      if (!items) return null;
      return items.map(item => ({ ...item, date: dateStr }));
    }

    // 依目前日期渲染右側「景點與交通速查」快捷按鈕
    function renderQuickLinks() {
      const container = document.getElementById('quick-links');
      if (!container) return;

      const d = new Date(currentDate);
      const key = `${d.getMonth() + 1}/${d.getDate()}`;
      const links = QUICK_LINKS[key] || [];
      // 10/8 與 10/9 額外顯示「東京精選美食口袋名單」專區（10/7 已移除）
      const showGourmet = GOURMET_DATES.includes(key);

      if (links.length === 0 && !showGourmet) {
        container.innerHTML = `<p class="text-sm text-stone-500">今日暫無速查資訊，隨時回來查看 🍁</p>`;
        return;
      }

      const quickLinksHtml = links.map(link => {
        // action: 'flight' → 開啟航班彈窗；action: 'spot' → 開啟景點詳細介紹彈窗；其餘維持外部連結
        const isFlightAction = link.action === 'flight';
        const isSpotAction = link.action === 'spot';
        const openTag = isFlightAction
          ? `<button type="button" onclick="openFlightDetail('${link.flight || 'return'}')"`
          : isSpotAction
            ? `<button type="button" onclick="openSpotDetail('${link.spot}')"`
            : `<a href="${link.url}" target="_blank" rel="noopener"`;
        const closeTag = (isFlightAction || isSpotAction) ? '</button>' : '</a>';
        const trailingIcon = (isFlightAction || isSpotAction) ? 'fa-circle-info' : 'fa-arrow-up-right-from-square';

        return `
        ${openTag}
           class="quick-link-btn w-full text-left flex items-center gap-3 rounded-xl bg-white/85 border border-white/60 p-3 shadow-sm hover:bg-white">
          <span class="text-xl min-w-[34px] text-center" aria-hidden="true">${link.icon}</span>
          <span class="flex-1 min-w-0">
            <span class="block text-sm font-bold text-stone-900 leading-snug">${link.title}</span>
            ${link.subtitle ? `<span class="block text-xs text-stone-500 mt-0.5">${link.subtitle}</span>` : ''}
          </span>
          <span class="text-amber-600 shrink-0" aria-hidden="true">
            <i class="fa-solid ${trailingIcon} text-xs"></i>
          </span>
        ${closeTag}
      `;
      }).join('');

      // 一般速查按鈕 + （10/7、10/8）東京精選美食口袋名單
      container.innerHTML = quickLinksHtml + (showGourmet ? getGourmetSectionHtml() : '');
    }

            <h3 class="text-sm font-bold text-stone-900">東京精選美食與購物口袋名單</h3>
          </div>
          <p class="text-xs text-stone-600 mt-1 mb-3">Tokyo Gourmet &amp; Shopping · 點擊卡片查看店家介紹，或直接開啟地圖導航</p>
          <div class="space-y-2.5">${cards}</div>
        </div>
      `;
    }

    // 開啟指定美食的簡介彈窗
    function openGourmetDetail(index) {
      const item = TOKYO_GOURMET[index];
      const modal = document.getElementById('gourmet-modal');
      if (!item || !modal) return;

      document.getElementById('gourmet-modal-icon').textContent = item.icon;
      document.getElementById('gourmet-modal-title').textContent = item.modalTitle || item.title;
      document.getElementById('gourmet-modal-subtitle').textContent = item.subtitle || '';

      // 簡介文字：有 desc 時顯示，否則隱藏（避免空白間距）
      const descEl = document.getElementById('gourmet-modal-desc');
      if (item.desc) {
        descEl.textContent = item.desc;
        descEl.classList.remove('hidden');
      } else {
        descEl.classList.add('hidden');
      }

      // 資訊表格：有 rows 時顯示並渲染（與景點詳細彈窗同結構），否則隱藏
      const rowsEl = document.getElementById('gourmet-modal-rows');
      if (item.rows && item.rows.length) {
        rowsEl.innerHTML = item.rows.map(row => `
          <div class="flex items-start gap-2 rounded-lg bg-stone-50 border border-stone-200 p-2.5">
            <dt class="w-32 shrink-0 text-xs font-semibold text-stone-500">${row.label}</dt>
            <dd class="flex-1 min-w-0 text-xs font-bold text-stone-900 break-words">${row.value}</dd>
          </div>
        `).join('');
        rowsEl.classList.remove('hidden');
      } else {
        rowsEl.classList.add('hidden');
      }

      // 導航按鈕：優先使用 item.mapLabel，否則顯示預設文字
      document.getElementById('gourmet-modal-map').href = getGourmetMapUrl(item);
      document.getElementById('gourmet-modal-map-label').textContent = item.mapLabel || '開啟地圖導航';

      // 官方網站按鈕：有 siteUrl 時顯示並套用連結
      const siteEl = document.getElementById('gourmet-modal-site');
      if (item.siteUrl) {
        siteEl.href = item.siteUrl;
        document.getElementById('gourmet-modal-site-label').textContent = item.siteLabel || '官方網站';
        siteEl.style.display = 'inline-flex';
      } else {
        siteEl.style.display = 'none';
      }

      const tipsEl = document.getElementById('gourmet-modal-tips');
      if (item.tips) {
        tipsEl.textContent = item.tips;
        tipsEl.classList.remove('hidden');
      } else {
        tipsEl.classList.add('hidden');
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // 關閉美食簡介彈窗
    function closeGourmetDetail() {
      const modal = document.getElementById('gourmet-modal');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 開啟航班資訊彈窗（key: 'outbound' 去程 10/3 / 'return' 回程 10/10）
    function openFlightDetail(key) {
      const modal = document.getElementById('flight-modal');
      const flight = CATHAY_FLIGHTS[key] || CATHAY_FLIGHTS.return;
      if (!modal || !flight) return;

      document.getElementById('flight-modal-title').textContent = flight.title;
      document.getElementById('flight-modal-subtitle').textContent = flight.subtitle;
      document.getElementById('flight-modal-note').textContent = flight.note;
      document.getElementById('flight-modal-rows').innerHTML = flight.rows.map(row => `
        <div class="flex items-start gap-2 rounded-lg bg-stone-50 border border-stone-200 p-2.5">
          <dt class="w-32 shrink-0 text-xs font-semibold text-stone-500">${row.label}</dt>
          <dd class="flex-1 min-w-0 text-xs font-bold text-stone-900 break-words">${row.value}</dd>
        </div>
      `).join('');
      document.getElementById('flight-modal-map').href = getMapUrl({ map_url: flight.mapQuery });
      document.getElementById('flight-modal-map-label').textContent = flight.mapLabel;
      document.getElementById('flight-modal-site').href = flight.officialUrl;
      document.getElementById('flight-modal-site-label').textContent = flight.siteLabel;

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // 關閉回程航班資訊彈窗
    function closeFlightDetail() {
      const modal = document.getElementById('flight-modal');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 開啟景點詳細介紹彈窗（key 對應 SPOT_DETAILS 的鍵值）
    function openSpotDetail(key) {
      const modal = document.getElementById('spot-modal');
      const spot = SPOT_DETAILS[key];
      if (!modal || !spot) return;

      document.getElementById('spot-modal-icon').textContent = spot.icon;
      document.getElementById('spot-modal-title').textContent = spot.title;
      document.getElementById('spot-modal-subtitle').textContent = spot.subtitle;
      document.getElementById('spot-modal-note').textContent = spot.note;

      document.getElementById('spot-modal-rows').innerHTML = spot.rows.map(row => `
        <div class="flex items-start gap-2 rounded-lg bg-stone-50 border border-stone-200 p-2.5">
          <dt class="w-32 shrink-0 text-xs font-semibold text-stone-500">${row.label}</dt>
          <dd class="flex-1 min-w-0 text-xs font-bold text-stone-900 break-words">${row.value}</dd>
        </div>
      `).join('');

      document.getElementById('spot-modal-map').href = getMapUrl({ map_url: spot.mapQuery });
      document.getElementById('spot-modal-map-label').textContent = spot.mapLabel;

      const siteLink = document.getElementById('spot-modal-site');
      if (spot.siteUrl) {
        siteLink.href = spot.siteUrl;
        document.getElementById('spot-modal-site-label').textContent = spot.siteLabel;
        siteLink.style.display = 'inline-flex';
      } else {
        siteLink.style.display = 'none';
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // 關閉景點詳細介紹彈窗
    function closeSpotDetail() {
      const modal = document.getElementById('spot-modal');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 按 ESC 可關閉美食簡介 / 回程航班資訊 / 景點詳細介紹彈窗
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closeGourmetDetail();
        closeFlightDetail();
        closeSpotDetail();
      }
    });

    async function fetchItinerary() {
      const refreshIcon = document.getElementById('refresh-icon');
      refreshIcon.classList.add('fa-spin');
      
      try {
        const response = await fetch(API_URL);
        allData = await response.json();
        
        // 取得所有不重複日期（API + 本地行程資料）
        const dates = getAllDates();
        
        if (dates.length > 0) {
          if (!currentDate) currentDate = dates[0];
          setBackground(getBackgroundForDate(currentDate));
          renderTabs(dates);
          renderTimeline();
          renderQuickLinks();
        }
      } catch (error) {
        alert("資料載入失敗，請確認 API 網址設定！");
        console.error(error);
      } finally {
        refreshIcon.classList.remove('fa-spin');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('timeline').classList.remove('hidden');
      }
    }

    function renderTabs(dates) {
      const tabsContainer = document.getElementById('date-tabs');
      tabsContainer.innerHTML = dates.map(d => {
        const dateObj = new Date(d);
        const dayStr = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
        const isActive = d === currentDate;
        
        return `
          <button onclick="switchDate('${d}')" 
            class="px-4 py-2 text-xs font-semibold rounded-full whitespace-nowrap transition-all ${
              isActive 
                ? 'bg-amber-700 text-white shadow-sm' 
                : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
            }">
            ${dayStr}
          </button>
        `;
      }).join('');
    }

    function switchDate(date) {
      currentDate = date;
      setBackground(getBackgroundForDate(date));
      const dates = getAllDates();
      renderTabs(dates);
      renderTimeline();
      renderQuickLinks();
    }

    function renderTimeline() {
      const container = document.getElementById('timeline');
      const localItems = getLocalItemsForDate(currentDate);
      const filtered = localItems || allData.filter(item => item.date === currentDate);

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center text-stone-200 py-8 text-sm">今日暫無行程安排</p>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        let icon = "🗻";
        let categoryBg = "bg-emerald-100 text-emerald-800";
        
        if (item.category === "Transport") {
          icon = "🚗";
          categoryBg = "bg-orange-100 text-orange-800";
        } else if (item.category === "Hotel") {
          icon = "♨️";
          categoryBg = "bg-indigo-100 text-indigo-800";
        } else if (item.category === "Food") {
          icon = "🍙";
          categoryBg = "bg-rose-100 text-rose-800";
        }

        // 動作按鈕區（地圖導航 + 巴士時間表）
        const actionsHtml = (item.map_url || item.bus_url) ? `
          <div class="flex flex-wrap items-center gap-3 mt-3">
            ${item.map_url ? `
              <a href="${getMapUrl(item)}" target="_blank" class="map-btn inline-flex items-center gap-1.5 text-xs font-semibold bg-amber-600 text-white px-3 py-1.5 rounded-full hover:bg-amber-700 transition-colors">
                <i class="fa-solid fa-diamond-turn-right"></i>開啟地圖導航
              </a>
            ` : ''}
            ${item.bus_url ? `
              <a href="${item.bus_url}" target="_blank" class="inline-flex items-center gap-1 text-xs font-semibold bg-white text-stone-700 border border-stone-300 px-3 py-1.5 rounded-full hover:bg-stone-50 transition-colors">
                🚌 巴士時間表
              </a>
            ` : ''}
          </div>
        ` : '';

        return `
          <div class="bg-white/85 backdrop-blur-md rounded-2xl p-4 shadow-md border border-white/50 flex gap-4 items-start hover:-translate-y-1 hover:shadow-lg transition-all duration-300">
            <div class="text-center min-w-[56px] flex flex-col items-center">
              <span class="inline-block text-xs font-bold text-white bg-amber-600 px-2.5 py-1 rounded-full shadow-sm whitespace-nowrap">${formatTime(item.time) || '--:--'}</span>
              <span class="inline-block mt-2 p-2 rounded-full text-base leading-none ${categoryBg}">${icon}</span>
            </div>
            
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-stone-900 text-base">${item.title}</h3>
              ${item.location ? `<p class="text-xs text-stone-600 mt-1"><i class="fa-solid fa-location-dot mr-1"></i>${item.location}</p>` : ''}
              ${item.notes ? `<p class="text-xs text-stone-700 mt-2 bg-stone-50/80 p-2 rounded border border-stone-200">${item.notes}</p>` : ''}
              
              ${item.image_url ? `
                <img src="${item.image_url}" alt="${item.title}" loading="lazy" class="mt-2 w-full rounded-lg object-cover">
              ` : ''}
              
              ${actionsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    // 產生飄落的秋葉（🍁🍂）背景動畫
    (function createFallingLeaves() {
      const container = document.getElementById('falling-leaves');
      if (!container) return;
      const leafEmojis = ['🍁', '🍂', '🍁', '🍂', '🍁'];
      for (let i = 0; i < 15; i++) {
        const leaf = document.createElement('span');
        leaf.className = 'falling-leaf';
        leaf.textContent = leafEmojis[i % leafEmojis.length];
        leaf.style.left = (Math.random() * 100) + 'vw';
        leaf.style.fontSize = (0.9 + Math.random() * 1.1) + 'rem';
        leaf.style.animationDuration = (9 + Math.random() * 10) + 's';
        leaf.style.animationDelay = (Math.random() * 12) + 's';
        container.appendChild(leaf);
      }
    })();

    fetchItinerary();
  </script>
</body>
</html>
