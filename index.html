<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京 & 上高地之旅 2026</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 自訂動畫樣式（秋日自駕主題） -->
  <style>
    /* 頁面背景設定：確保 cover / center / no-repeat / fixed 皆生效 */
    body {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* 可愛小汽車行駛/搖晃動畫 */
    @keyframes car-drive {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(3px) rotate(-4deg); }
      75% { transform: translateX(-3px) rotate(4deg); }
    }
    .car-drive {
      display: inline-block;
      animation: car-drive 1.6s ease-in-out infinite;
    }

    /* 重新整理按鈕 hover 旋轉 */
    .refresh-btn i {
      display: inline-block;
      transition: transform 0.5s ease;
    }
    .refresh-btn:hover i {
      transform: rotate(180deg);
    }

    /* 楓葉飄落動畫 */
    @keyframes leaf-fall {
      0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.75; }
      100% { transform: translateY(110vh) translateX(70px) rotate(360deg); opacity: 0; }
    }
    .falling-leaf {
      position: absolute;
      top: 0;
      pointer-events: none;
      animation: leaf-fall linear infinite;
    }

    /* 地圖導航按鈕脈衝動畫 */
    @keyframes gentle-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .map-btn {
      animation: gentle-pulse 2s ease-in-out infinite;
    }
    .map-btn:hover {
      animation-play-state: paused;
    }

    /* 載入吉祥物彈跳動畫 */
    @keyframes float-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .loading-mascot {
      display: inline-block;
      animation: float-bounce 1.4s ease-in-out infinite;
    }

    /* 景點與交通速查按鈕：hover 微放大 + 柔和琥珀色光暈 */
    .quick-link-btn {
      transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    }
    .quick-link-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 24px -8px rgba(217, 119, 6, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
    }
    .quick-link-btn:active {
      transform: translateY(0) scale(0.98);
    }

  </style>
</head>
<body class="min-h-screen pb-12 text-stone-800 bg-cover bg-center bg-no-repeat bg-fixed bg-stone-800" style="background-image: url('images/10-3.jpg');">
  <!-- 背景微暗遮罩（避免背景搶走文字焦點） -->
  <div class="fixed inset-0 z-[1] bg-black/25" aria-hidden="true"></div>

  <!-- 飄落楓葉背景動畫 -->
  <div id="falling-leaves" class="fixed inset-0 z-[2] pointer-events-none overflow-hidden" aria-hidden="true"></div>

  <!-- Header Banner -->
  <header class="bg-amber-950 text-amber-50 py-6 px-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <div class="flex items-center gap-2">
          <span class="car-drive text-2xl drop-shadow-sm" aria-hidden="true">🚗</span>
          <h1 class="text-xl font-bold tracking-wide text-amber-100">東京 & 上高地行程</h1>
        </div>
        <p class="text-xs text-amber-300 mt-1">2026 Autumn Driving Tour · 2026.10.03 - 10.10</p>
      </div>
      <button onclick="fetchItinerary()" class="refresh-btn text-amber-300 hover:text-amber-100 p-2" title="重新整理" aria-label="重新整理">
        <i id="refresh-icon" class="fa-solid fa-rotate-right text-lg"></i>
      </button>
    </div>
  </header>

  <!-- 日期切換 Tab 列 -->
  <div class="bg-stone-50 border-b border-stone-200 sticky top-[73px] z-40 shadow-sm">
    <div id="date-tabs" class="max-w-md mx-auto flex overflow-x-auto py-2 px-3 gap-2 scrollbar-none md:ml-6 lg:ml-12 lg:mr-auto">
      <!-- 由 JS 動態產生日期按鈕 -->
    </div>
  </div>

  <!-- 行程 Timeline + 右側速查 內容區（桌面左右並排，手機自動堆疊） -->
  <main class="relative z-10 w-full px-4 mt-6 md:ml-6 lg:ml-12 lg:mr-auto lg:max-w-6xl lg:px-6">
    <div class="max-w-md mx-auto md:mx-0 lg:max-w-none">
      <div class="lg:grid lg:grid-cols-12 lg:gap-8 lg:items-start">

        <!-- 左側：每日行程時間軸 -->
        <section class="lg:col-span-6">
          <div id="loading" class="text-center py-12 text-stone-200">
            <div class="loading-mascot text-5xl mb-3 drop-shadow" aria-hidden="true">🗻</div>
            <p class="text-sm font-medium">
              <i class="fa-solid fa-spinner fa-spin text-amber-400 mr-1"></i>載入行程資料中...
            </p>
          </div>

          <div id="timeline" class="space-y-4 hidden">
            <!-- 行程卡片 JS 動態注入 -->
          </div>
        </section>

        <!-- 右側：景點與交通速查 (Quick Links & Info) -->
        <aside class="lg:col-span-6 mt-8 lg:mt-0">
          <div class="bg-white/70 backdrop-blur-md rounded-2xl p-5 shadow-lg border border-white/40">
            <div class="flex items-center gap-2">
              <span class="text-xl" aria-hidden="true">📌</span>
              <h2 class="text-lg font-bold text-stone-900">景點與交通速查</h2>
            </div>
            <p class="text-xs text-stone-600 mt-1 mb-4">
              Quick Links &amp; Info · 依每日行程顯示對應的快捷資訊按鈕
            </p>
            <div id="quick-links" class="space-y-2.5">
              <!-- 由 JS 依日期動態產生快捷按鈕 -->
              <p class="text-sm text-stone-500">載入中...</p>
            </div>
          </div>
        </aside>

      </div>
    </div>
  </main>

  <!-- 頁尾可愛小亮點 -->
  <footer class="relative z-10 max-w-md mx-auto px-4 mt-10 pb-4 text-center text-xs text-stone-200">
    <p class="flex items-center justify-center gap-2 text-base drop-shadow" aria-hidden="true">🍁 🚗 ♨️ 🗻 🍁</p>
    <p class="mt-1 font-medium">東京 & 上高地 · 秋日自駕之旅 2026</p>
  </footer>

  <script>
    // ⚠️ 稍後建立 Apps Script 後，將取得的 Web App URL 貼在此處
    const API_URL = "https://script.google.com/macros/s/AKfycbzqGdc4Ht_cyHIGso6pG6hhtsiw0Lv_iRUgJFlHwEBU3qWsiEEehqoAYW7tojCmxaM/exec";

    let allData = [];
    let currentDate = "";

    // 每日背景圖片對應表（依日期切換景點風景照，對應 images 資料夾內照片）
    const bgImages = {
      '10/3': 'images/10-3.jpg', // 箱根蘆之湖與鳥居
      '10/4': 'images/10-4.jpg', // 御殿場 / 富士山
      '10/5': 'images/10-5.jpg', // 長野 諏訪湖
      '10/6': 'images/10-6.jpg', // 長野 上高地 梓川
      '10/7': 'images/10-7.jpg', // 10/7 行程照片
      '10/8': 'images/10-8.jpg', // 10/8 行程照片
      '10/9': 'images/10-8.jpg', // 10/9 沿用 10/8 照片
      '10/10': 'images/10-7.jpg', // 10/10 沿用 10/7 照片
    };
    const DEFAULT_BACKGROUND = 'images/10-3.jpg'; // 預設 / 其他日期一律使用 10/3 照片

    // 取得某日期對應的背景圖片（無對應時回傳預設 10/3 圖）
    function getBackgroundForDate(dateStr) {
      const d = new Date(dateStr);
      const key = `${d.getMonth() + 1}/${d.getDate()}`;
      return bgImages[key] || DEFAULT_BACKGROUND;
    }

    // 設定頁面背景：直接寫入 body 的 inline style（使用 url('...') 格式）
    function setBackground(imageUrl) {
      document.body.style.backgroundImage = `url('${imageUrl || DEFAULT_BACKGROUND}')`;
    }

    // 頁面初始化時，預設載入 images/10-3.jpg
    document.addEventListener('DOMContentLoaded', function () {
      document.body.style.backgroundImage = `url('${bgImages['10/3'] || DEFAULT_BACKGROUND}')`;
    });

    // 產生地圖導航連結：
    // 若 map_url 已是完整網址（以 http/https 開頭）則直接使用；
    // 否則轉為 Google 地圖搜尋連結，查詢字串優先使用 map_url，若無則使用 location。
    function getMapUrl(item) {
      const raw = item.map_url || '';
      if (/^https?:\/\//i.test(raw)) return raw;
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.map_url || item.location)}`;
    }

    // 將時間格式化為乾淨的 HH:mm 24 小時制文字（如 10:00）
    // 若已是 HH:mm 格式則保持原樣；若為 ISO 日期字串（如 1899-12-30T02:23:18.000Z）則取出時間部分
    function formatTime(time) {
      if (!time) return time;
      // 已符合 HH:mm（例如 10:00 / 02:00），直接回傳
      if (/^\d{1,2}:\d{2}$/.test(time)) return time;
      // 透過 Date 解析，取出的 HH:mm 為 24 小時制、補零至兩位數
      const date = new Date(time);
      if (isNaN(date.getTime())) return time;
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    // ===== 每日「景點與交通速查」快捷按鈕資料 =====
    // 每個按鈕包含：icon 圖示 / title 標題 / subtitle 小註解 / url 連結（官方網站或 Google 地圖搜尋）
    const TOKYO_QUICK_LINKS = [
      { icon: '🗼', title: '東京 / 銀座 購物與美食導覽', subtitle: '銀座商店街、美食與逛街重點', url: 'https://www.google.com/maps/search/?api=1&query=銀座 東京' },
      { icon: '✈️', title: '成田機場 回程登機資訊', subtitle: '機場官方網站 · 航班與交通', url: 'https://www.narita-airport.jp/zh_tw/' },
    ];

    const QUICK_LINKS = {
      '10/3': [
        { icon: '🚗', title: '海老名 SA 休息站指南', subtitle: '東名高速第一個大型休息站', url: 'https://www.google.com/maps/search/?api=1&query=海老名サービスエリア' },
        { icon: '☕', title: 'Bakery & Table 箱根', subtitle: '蘆之湖湖景 × 足湯咖啡', url: 'https://www.google.com/maps/search/?api=1&query=Bakery%26Table%20箱根' },
        { icon: '♨️', title: '星野集團 界 箱根', subtitle: '溫泉旅館官網 / 設施資訊', url: 'https://kai-ryokan.jp/ja/hakone/' },
      ],
      '10/4': [
        { icon: '⛴️', title: '箱根海賊船', subtitle: '時刻表 / 航線資訊', url: 'https://www.hakone-kankosen.co.jp/' },
        { icon: '🚡', title: '箱根駒ヶ岳纜車 / 芦ノソラ', subtitle: '蘆之湖空中散步與觀景台', url: 'https://www.hakonekomagatake.com/' },
        { icon: '🌋', title: '大湧谷 即時火山與交通', subtitle: '日本氣象廳火山情報', url: 'https://www.jma.go.jp/jp/volcano/' },
        { icon: '🍣', title: 'さかなや 本店 居酒屋', subtitle: '箱根湯本 在地海鮮居酒屋', url: 'https://www.google.com/maps/search/?api=1&query=さかなや 本店 箱根' },
      ],
      '10/5': [
        { icon: '🗻', title: '御殿場 HOTEL CLAD', subtitle: '富士山景度假飯店官方網站', url: 'https://www.hotelclad.jp/' },
        { icon: '🌊', title: '諏訪湖 立石公園觀景台', subtitle: '諏訪湖全景眺望點', url: 'https://www.google.com/maps/search/?api=1&query=立石公園 諏訪湖' },
        { icon: '🍜', title: '信州蕎麥前 Gadogado - 手打蕎麥麵', subtitle: '風格現代且充滿質感的蕎麥麵居酒屋，結合傳統信州手打蕎麥麵與創意日式小菜、地酒。', url: 'https://www.google.com/maps/search/?api=1&query=信州蕎麥前 Gadogado' },
      ],
      '10/6': [
        { icon: '🍎', title: 'Trois Cinq Kamikochi - 現烤信州蘋果派', subtitle: '河童橋畔人氣甜點咖啡館 · 現烤蘋果派每日限量（16:00 關門）', url: 'https://www.google.com/maps/search/?api=1&query=Trois Cinq Kamikochi' },
        { icon: '⛰️', title: '大正池 & 梓川健行路線地圖', subtitle: '河童橋 → 田代池 → 大正池 健行路線', url: 'https://www.google.com/maps/search/?api=1&query=大正池 上高地' },
        { icon: '🚌', title: '澤渡停車場 / 上高地接駁交通資訊', subtitle: '停車場位置與接駁巴士・的士資訊', url: 'https://www.google.com/maps/search/?api=1&query=沢渡駐車場 上高地' },
      ],
      // 10/8 - 10/10 共用東京 / 回程資訊
      '10/7': [
        { icon: '🛍️', title: '談合坂 SA - 旗艦級休息站 / 伴手禮&美食指南', subtitle: '中央自動車道必停大休息站 · 山梨・長野伴手禮與美食', url: 'https://www.google.com/maps/search/?api=1&query=談合坂サービスエリア' },
        { icon: '⛩️', title: '明神一之池 & 穗高神社奧宮 介紹', subtitle: '上高地明神池絕景與神社參拜', url: 'https://www.google.com/maps/search/?api=1&query=明神池 上高地' },
        { icon: '🐟', title: '嘉門次小屋 傳統炭火烤岩魚', subtitle: '百年歷史小屋 · 炭火鹽烤岩魚', url: 'https://www.google.com/maps/search/?api=1&query=嘉門次小屋 上高地' },
      ],
      '10/8': TOKYO_QUICK_LINKS,
      '10/9': TOKYO_QUICK_LINKS,
      '10/10': TOKYO_QUICK_LINKS,
    };

    // ===== 本地行程資料覆寫 =====
    // 以 'M/D' 為 key，指定日期時該日期的本地行程優先於 API 資料渲染；
    // 若 API 缺少該日期，也會自動補上對應的日期 Tab。
    const LOCAL_ITINERARY = {
      '10/6': [
        { time: '09:00', title: '出發前往澤渡停車場', category: 'Transport', location: '箱根・御殿場 → 澤渡停車場', notes: '自駕約 1.5 小時', map_url: '澤渡駐車場 上高地' },
        { time: '10:45', title: '澤渡轉乘巴士 / 的士前往河童橋', category: 'Transport', location: '澤渡停車場 → 河童橋', notes: '於停車場轉乘接駁巴士或的士前往上高地', map_url: '澤渡駐車場 上高地' },
        { time: '11:15', title: '上高地白樺莊 寄存行李 & 輕量午餐', category: 'Hotel', location: '上高地白樺莊', notes: '先寄存行李，簡單享用午餐', map_url: '上高地白樺荘' },
        { time: '12:15', title: '梓川河畔健行（河童橋 ➔ 田代池 ➔ 大正池 ➔ 原路折返）', category: 'Sightseeing', location: '河童橋・田代池・大正池', notes: '沿梓川漫步，欣賞上高地秋日景色', map_url: '大正池 上高地' },
        { time: '15:00', title: 'Trois Cinq 享用現烤信州蘋果派與咖啡', category: 'Food', location: 'Trois Cinq Kamikochi', notes: '必吃現烤蘋果派（16:00 關門）', map_url: 'Trois Cinq Kamikochi' },
        { time: '16:00', title: '入住上高地白樺莊飯店', category: 'Hotel', location: '上高地白樺莊', notes: 'Check-in 入住', map_url: '上高地白樺荘' },
      ],
      '10/7': [
        { time: '08:00', title: '晨間漫步至明神一之池', category: 'Sightseeing', location: '穗高神社奧宮 / 嘉門次小屋', notes: '沿梓川北上至明神池，參拜穗高神社奧宮，途經嘉門次小屋', map_url: '明神池 上高地' },
        { time: '10:30', title: '返回白樺莊取行李，轉乘接駁車 / 的士至澤渡停車場取車', category: 'Transport', location: '白樺莊 → 澤渡停車場', notes: '搭乘接駁巴士或的士返回澤渡停車場取車', map_url: '沢渡駐車場 上高地' },
        { time: '11:30', title: '澤渡取車出發，開車返回東京', category: 'Transport', location: '澤渡停車場 → 東京', notes: '中央自動車道（中央道）北上', map_url: '沢渡駐車場' },
        { time: '13:30', title: '談合坂 SA (上行) 中途大休息', category: 'Food', location: '談合坂服務區（中央自動車道 上行）', notes: '享用午餐、採買山梨/長野伴手禮', map_url: '談合坂サービスエリア' },
        { time: '16:30', title: '入住ダイワロイネットホテル 銀座 PREMIER 並辦理還車', category: 'Hotel', location: 'ダイワロイネットホテル 銀座 PREMIER', notes: 'Check-in 並完成還車手續', map_url: 'ダイワロイネットホテル銀座PREMIER' },
      ],
    };

    // 取得所有不重複日期（合併 API 資料與本地行程資料）
    function getAllDates() {
      const dates = [...new Set(allData.map(item => item.date))];
      Object.keys(LOCAL_ITINERARY).forEach(key => {
        if (!dates.some(d => {
          const dd = new Date(d);
          return `${dd.getMonth() + 1}/${dd.getDate()}` === key;
        })) {
          dates.push(`2026-${key.replace('/', '-')}`);
        }
      });
      return dates.sort();
    }

    // 取得某日期的本地行程資料（該日無覆寫資料時回傳 null）
    function getLocalItemsForDate(dateStr) {
      const d = new Date(dateStr);
      const key = `${d.getMonth() + 1}/${d.getDate()}`;
      const items = LOCAL_ITINERARY[key];
      if (!items) return null;
      return items.map(item => ({ ...item, date: dateStr }));
    }

    // 依目前日期渲染右側「景點與交通速查」快捷按鈕
    function renderQuickLinks() {
      const container = document.getElementById('quick-links');
      if (!container) return;

      const d = new Date(currentDate);
      const key = `${d.getMonth() + 1}/${d.getDate()}`;
      const links = QUICK_LINKS[key] || [];

      if (links.length === 0) {
        container.innerHTML = `<p class="text-sm text-stone-500">今日暫無速查資訊，隨時回來查看 🍁</p>`;
        return;
      }

      container.innerHTML = links.map(link => `
        <a href="${link.url}" target="_blank" rel="noopener"
           class="quick-link-btn flex items-center gap-3 rounded-xl bg-white/85 border border-white/60 p-3 shadow-sm hover:bg-white">
          <span class="text-xl min-w-[34px] text-center" aria-hidden="true">${link.icon}</span>
          <span class="flex-1 min-w-0">
            <span class="block text-sm font-bold text-stone-900 leading-snug">${link.title}</span>
            ${link.subtitle ? `<span class="block text-xs text-stone-500 mt-0.5">${link.subtitle}</span>` : ''}
          </span>
          <span class="text-amber-600 shrink-0" aria-hidden="true">
            <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
          </span>
        </a>
      `).join('');
    }

    async function fetchItinerary() {
      const refreshIcon = document.getElementById('refresh-icon');
      refreshIcon.classList.add('fa-spin');
      
      try {
        const response = await fetch(API_URL);
        allData = await response.json();
        
        // 取得所有不重複日期（API + 本地行程資料）
        const dates = getAllDates();
        
        if (dates.length > 0) {
          if (!currentDate) currentDate = dates[0];
          setBackground(getBackgroundForDate(currentDate));
          renderTabs(dates);
          renderTimeline();
          renderQuickLinks();
        }
      } catch (error) {
        alert("資料載入失敗，請確認 API 網址設定！");
        console.error(error);
      } finally {
        refreshIcon.classList.remove('fa-spin');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('timeline').classList.remove('hidden');
      }
    }

    function renderTabs(dates) {
      const tabsContainer = document.getElementById('date-tabs');
      tabsContainer.innerHTML = dates.map(d => {
        const dateObj = new Date(d);
        const dayStr = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
        const isActive = d === currentDate;
        
        return `
          <button onclick="switchDate('${d}')" 
            class="px-4 py-2 text-xs font-semibold rounded-full whitespace-nowrap transition-all ${
              isActive 
                ? 'bg-amber-700 text-white shadow-sm' 
                : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
            }">
            ${dayStr}
          </button>
        `;
      }).join('');
    }

    function switchDate(date) {
      currentDate = date;
      setBackground(getBackgroundForDate(date));
      const dates = getAllDates();
      renderTabs(dates);
      renderTimeline();
      renderQuickLinks();
    }

    function renderTimeline() {
      const container = document.getElementById('timeline');
      const localItems = getLocalItemsForDate(currentDate);
      const filtered = localItems || allData.filter(item => item.date === currentDate);

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center text-stone-200 py-8 text-sm">今日暫無行程安排</p>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        let icon = "🗻";
        let categoryBg = "bg-emerald-100 text-emerald-800";
        
        if (item.category === "Transport") {
          icon = "🚗";
          categoryBg = "bg-orange-100 text-orange-800";
        } else if (item.category === "Hotel") {
          icon = "♨️";
          categoryBg = "bg-indigo-100 text-indigo-800";
        } else if (item.category === "Food") {
          icon = "🍙";
          categoryBg = "bg-rose-100 text-rose-800";
        }

        // 動作按鈕區（地圖導航 + 巴士時間表）
        const actionsHtml = (item.map_url || item.bus_url) ? `
          <div class="flex flex-wrap items-center gap-3 mt-3">
            ${item.map_url ? `
              <a href="${getMapUrl(item)}" target="_blank" class="map-btn inline-flex items-center gap-1.5 text-xs font-semibold bg-amber-600 text-white px-3 py-1.5 rounded-full hover:bg-amber-700 transition-colors">
                <i class="fa-solid fa-diamond-turn-right"></i>開啟地圖導航
              </a>
            ` : ''}
            ${item.bus_url ? `
              <a href="${item.bus_url}" target="_blank" class="inline-flex items-center gap-1 text-xs font-semibold bg-white text-stone-700 border border-stone-300 px-3 py-1.5 rounded-full hover:bg-stone-50 transition-colors">
                🚌 巴士時間表
              </a>
            ` : ''}
          </div>
        ` : '';

        return `
          <div class="bg-white/85 backdrop-blur-md rounded-2xl p-4 shadow-md border border-white/50 flex gap-4 items-start hover:-translate-y-1 hover:shadow-lg transition-all duration-300">
            <div class="text-center min-w-[56px] flex flex-col items-center">
              <span class="inline-block text-xs font-bold text-white bg-amber-600 px-2.5 py-1 rounded-full shadow-sm whitespace-nowrap">${formatTime(item.time) || '--:--'}</span>
              <span class="inline-block mt-2 p-2 rounded-full text-base leading-none ${categoryBg}">${icon}</span>
            </div>
            
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-stone-900 text-base">${item.title}</h3>
              ${item.location ? `<p class="text-xs text-stone-600 mt-1"><i class="fa-solid fa-location-dot mr-1"></i>${item.location}</p>` : ''}
              ${item.notes ? `<p class="text-xs text-stone-700 mt-2 bg-stone-50/80 p-2 rounded border border-stone-200">${item.notes}</p>` : ''}
              
              ${item.image_url ? `
                <img src="${item.image_url}" alt="${item.title}" loading="lazy" class="mt-2 w-full rounded-lg object-cover">
              ` : ''}
              
              ${actionsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    // 產生飄落的秋葉（🍁🍂）背景動畫
    (function createFallingLeaves() {
      const container = document.getElementById('falling-leaves');
      if (!container) return;
      const leafEmojis = ['🍁', '🍂', '🍁', '🍂', '🍁'];
      for (let i = 0; i < 15; i++) {
        const leaf = document.createElement('span');
        leaf.className = 'falling-leaf';
        leaf.textContent = leafEmojis[i % leafEmojis.length];
        leaf.style.left = (Math.random() * 100) + 'vw';
        leaf.style.fontSize = (0.9 + Math.random() * 1.1) + 'rem';
        leaf.style.animationDuration = (9 + Math.random() * 10) + 's';
        leaf.style.animationDelay = (Math.random() * 12) + 's';
        container.appendChild(leaf);
      }
    })();

    fetchItinerary();
  </script>
</body>
</html>
